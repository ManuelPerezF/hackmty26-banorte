<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=512, height=512" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 512px; height: 512px; overflow: hidden; background: transparent; }

      /* #stage sólo escala (CSS). #body es lo único que anima GSAP:
         separarlos evita que una transform de CSS pelee con la del tween. */
      #stage {
        position: absolute;
        left: 50%; top: 50%;
        width: 256px; height: 256px;
        margin: -128px 0 0 -128px;
        transform: scale(1.72);
      }
      #body { position: absolute; inset: 0; }
      #mark { display: block; width: 256px; height: 256px; }
      #face { position: absolute; inset: 0; }

      /* Los ojos se cierran sobre su propio centro. */
      .eye { transform-box: fill-box; transform-origin: center; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="4"
      data-width="512"
      data-height="512"
    >
      <div id="stage" class="clip" data-start="0" data-duration="4" data-track-index="1">
        <div id="body">
          <img id="mark" src="assets/maya-face.png" alt="" />
          <svg id="face" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
            <!-- Parches sobre los rasgos impresos del PNG: medidos contra el
                 archivo, cero píxeles del listón rojo dentro de estas cajas. -->
            <g fill="#fefefe">
              <rect x="112" y="111" width="22" height="14" />
              <rect x="158" y="111" width="22" height="14" />
              <rect x="136" y="122" width="23" height="16" />
            </g>
            <!-- Rasgos redibujados en vector, en las coordenadas originales. -->
            <g id="eyes" fill="#0d1119">
              <rect class="eye" x="115" y="115.5" width="15" height="4" rx="2" />
              <rect class="eye" x="161" y="115.5" width="15" height="4" rx="2" />
            </g>
            <path
              id="mouth"
              d="M141 127.6 Q146.5 133.8 152 127.6"
              fill="none"
              stroke="#0d1119"
              stroke-width="3.1"
              stroke-linecap="round"
            />
          </svg>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Respiración: ida y vuelta simétricas, así el fotograma 0 y el último
      // son idénticos y el bucle no tiene costura.
      tl.fromTo(
        "#body",
        { scale: 1, y: 0, rotation: -0.7 },
        { scale: 1.03, y: -6, rotation: 0.7, duration: 2, ease: "power1.inOut" },
        0
      );
      tl.to(
        "#body",
        { scale: 1, y: 0, rotation: -0.7, duration: 2, ease: "power1.inOut" },
        2
      );

      // Estado de reposo explícito: sin esto, el "from" del último fromTo
      // autorizado se convertiría en el valor de partida de cualquier seek
      // anterior a su tween (GSAP aplica los from al construir, no al tocarlos).
      tl.set(".eye", { scaleY: 1 }, 0);
      tl.set("#eyes", { x: 0 }, 0);

      // Parpadeos: pares fromTo explícitos, sin repeat ni yoyo, para que
      // cualquier seek del renderer caiga en un estado definido.
      [1.15, 3.05].forEach((t) => {
        tl.fromTo(
          ".eye",
          { scaleY: 1 },
          { scaleY: 0.08, duration: 0.09, ease: "power2.in", immediateRender: false },
          t
        );
        tl.fromTo(
          ".eye",
          { scaleY: 0.08 },
          { scaleY: 1, duration: 0.12, ease: "power2.out", immediateRender: false },
          t + 0.09
        );
      });

      // Mirada: un desplazamiento mínimo que vuelve a su sitio antes del final.
      tl.fromTo(
        "#eyes",
        { x: 0 },
        { x: 1.4, duration: 0.5, ease: "power2.inOut", immediateRender: false },
        1.9
      );
      tl.fromTo(
        "#eyes",
        { x: 1.4 },
        { x: 0, duration: 0.6, ease: "power2.inOut", immediateRender: false },
        2.8
      );

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
