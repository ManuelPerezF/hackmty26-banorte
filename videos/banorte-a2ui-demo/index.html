<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #FAF7F4;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="77"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="6.5"
        data-track-index="0"
      ></div>

      <div
        id="el-02-contraste"
        class="scene"
        data-composition-id="02-contraste"
        data-composition-src="compositions/frames/02-contraste.html"
        data-start="6"
        data-duration="8"
        data-track-index="1"
      ></div>

      <div
        id="el-03-intencion"
        class="scene"
        data-composition-id="03-intencion"
        data-composition-src="compositions/frames/03-intencion.html"
        data-start="14"
        data-duration="10.6"
        data-track-index="0"
      ></div>

      <div
        id="el-04-mcp"
        class="scene"
        data-composition-id="04-mcp"
        data-composition-src="compositions/frames/04-mcp.html"
        data-start="24"
        data-duration="12"
        data-track-index="1"
      ></div>

      <div
        id="el-05-a2ui"
        class="scene"
        data-composition-id="05-a2ui"
        data-composition-src="compositions/frames/05-a2ui.html"
        data-start="36"
        data-duration="12.5"
        data-track-index="0"
      ></div>

      <div
        id="el-06-adaptable"
        class="scene"
        data-composition-id="06-adaptable"
        data-composition-src="compositions/frames/06-adaptable.html"
        data-start="48"
        data-duration="10"
        data-track-index="1"
      ></div>

      <div
        id="el-07-accion"
        class="scene"
        data-composition-id="07-accion"
        data-composition-src="compositions/frames/07-accion.html"
        data-start="58"
        data-duration="12.5"
        data-track-index="0"
      ></div>

      <div
        id="el-08-cierre"
        class="scene"
        data-composition-id="08-cierre"
        data-composition-src="compositions/frames/08-cierre.html"
        data-start="70"
        data-duration="7"
        data-track-index="1"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-hook", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 6);
        tl.fromTo("#el-02-contraste", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 6);
        tl.to("#el-03-intencion", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.6, ease: "power2.inOut" }, 24);
        tl.fromTo("#el-04-mcp", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.6, ease: "power2.inOut" }, 24);
        tl.to("#el-05-a2ui", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 48);
        tl.fromTo("#el-06-adaptable", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 48);
        tl.to("#el-07-accion", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 70);
        tl.fromTo("#el-08-cierre", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 70);
        tl.to({}, { duration: 77 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
