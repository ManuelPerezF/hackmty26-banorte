  <script>
    (function () {
      var root = document.querySelector('[data-composition-id="04-mcp"]');
      var CX = 960,
        CY = 450;

      var orbit = root.querySelector("#mcp-orbit");
      var orbitLen = orbit.getTotalLength();
      gsap.set(orbit, { strokeDasharray: orbitLen });

      var nodes = Array.prototype.slice.call(root.querySelectorAll(".mcp-node"));
      var wires = Array.prototype.slice.call(root.querySelectorAll(".mcp-wire"));
      wires.forEach(function (w) {
        gsap.set(w, { strokeDasharray: w.getTotalLength() });
      });

      var hero = root.querySelector(".mcp-node-hero");
      var heroWire = root.querySelector(".mcp-wire-hero");
      var others = nodes.filter(function (n) {
        return n !== hero;
      });
      var otherWires = wires.filter(function (w) {
        return w !== heroWire;
      });

      var tl = gsap.timeline({ paused: true });

      /* Scene 1 (0.0–1.6) — kicker, headline, the core. */
      tl.fromTo("#mcp-kicker", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0);
      tl.fromTo("#mcp-head", { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.75, ease: "power3.out" }, 0.12);
      tl.fromTo("#mcp-core", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.7, ease: "power3.out" }, 0.5);
      tl.fromTo(orbit, { strokeDashoffset: orbitLen }, { strokeDashoffset: 0, duration: 1.5, ease: "power2.inOut" }, 0.85);

      /* Scene 2 (1.6–4.4) — 13 tool nodes cascade out of the core onto the ring,
         each with its hub connector drawing on. Layered depth: every node starts
         pulled 20% back toward the core, so the ring assembles in Z. */
      nodes.forEach(function (node, i) {
        var at = 1.6 + i * 0.16;
        var dx = parseFloat(node.getAttribute("data-x")) - CX;
        var dy = parseFloat(node.getAttribute("data-y")) - CY;
        tl.fromTo(
          node,
          { opacity: 0, scale: 0.38, x: -dx * 0.2, y: -dy * 0.2 },
          { opacity: 1, scale: 1, x: 0, y: 0, duration: 0.66, ease: "power3.out" },
          at
        );
        var wire = wires[i];
        tl.fromTo(
          wire,
          { strokeDashoffset: wire.getTotalLength() },
          { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" },
          at
        );
      });

      /* Scene 3 (4.4–6.6) — get_spending_insights lights coral, the other twelve
         fall to 35%, and a spark runs core → node → core. */
      tl.to(others, { opacity: 0.35, duration: 0.55, ease: "power2.out" }, 4.4);
      tl.to(otherWires, { opacity: 0.35, duration: 0.55, ease: "power2.out" }, 4.4);
      tl.to(".mcp-chip-hero", { backgroundColor: "#D71033", borderColor: "#D71033", color: "#FAF7F4", duration: 0.5, ease: "power2.out" }, 4.45);
      tl.to(".mcp-chip-hero .mcp-dot", { backgroundColor: "#FAF7F4", duration: 0.5, ease: "power2.out" }, 4.45);
      tl.to(hero, { scale: 1.09, duration: 0.5, ease: "power2.out" }, 4.45);
      tl.to(heroWire, { stroke: "#D71033", duration: 0.5, ease: "power2.out" }, 4.45);
      tl.fromTo("#mcp-spark", { opacity: 0, scale: 0.3, x: 0, y: 0 }, { opacity: 1, scale: 1, duration: 0.26, ease: "power2.out" }, 4.7);
      tl.to("#mcp-spark", { x: 531, y: -114, duration: 0.72, ease: "power2.inOut" }, 4.78);
      tl.to("#mcp-spark", { x: 0, y: 0, duration: 0.78, ease: "power2.inOut" }, 5.62);
      tl.to("#mcp-spark", { opacity: 0, scale: 0.3, duration: 0.32, ease: "power2.in" }, 6.3);

      /* Scene 4 (6.6–9.2) — the real gateway call unfolds under the ring. */
      tl.fromTo("#mcp-code", { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 6.6);
      tl.fromTo("#mcp-bar", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 6.95);
      tl.fromTo("#mcp-l1", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 7.2);
      tl.fromTo("#mcp-l2", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 7.75);
      tl.fromTo("#mcp-status", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" }, 8.35);

      /* Scene 5 (9.2–12.0) — push-in with depth-of-field: the ring is driven past
         the edges and blurs out, the core magnifies and resolves the read/write
         split. Holds to the end. */
      tl.to("#mcp-ring", { scale: 1.28, opacity: 0.2, "--mcp-dof": "7px", duration: 2, ease: "power2.inOut" }, 9.2);
      tl.to("#mcp-core", { y: -125, scale: 1.15, duration: 1.3, ease: "power3.out" }, 9.2);
      tl.fromTo("#mcp-r1", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 9.8);
      tl.fromTo("#mcp-r2", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 10.3);
      tl.to("#mcp-code", { scale: 1.03, duration: 1.6, ease: "power2.inOut" }, 10.2);

      window.__timelines = window.__timelines || {};
      window.__timelines["04-mcp"] = tl;
    })();
