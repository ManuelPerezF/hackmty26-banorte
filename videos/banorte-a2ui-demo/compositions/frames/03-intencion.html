  <script>
    (function () {
      var root = document.querySelector('[data-composition-id="03-intencion"]');
      var q = function (sel) {
        return root.querySelector(sel);
      };

      var world = q(".f03-world");
      var ghost = q(".f03-ghost");
      var shell = q(".f03-shell");
      var header = q(".f03-header");
      var greet = q(".f03-greet");
      var hello = q(".f03-hello");
      var sub = q(".f03-sub");
      var composer = q(".f03-composer");
      var note = q(".f03-note");
      var placeholder = q(".f03-placeholder");
      var typed = q(".f03-typed");
      var typedText = q(".f03-typed-text");
      var caret = q(".f03-caret");
      var send = q(".f03-send");
      var bubble = q(".f03-bubble");
      var status = q(".f03-status");
      var dot = q(".f03-dot");
      var tagA = q(".f03-tag-a");
      var tagB = q(".f03-tag-b");

      var CHARS = 23; // "¿En qué gasté este mes?"
      var TYPE_START = 2.1;
      var TYPE_DUR = 2.2;
      var MUTED = "#ece5de";
      var CORAL = "#d71033";

      var tl = gsap.timeline({ paused: true });

      // ---- Scene 1 (0.0–2.0): the shell rises and settles, three planes of depth
      tl.fromTo(world, { scale: 1 }, { scale: 1.035, duration: 10, ease: "power1.out" }, 0);
      tl.fromTo(ghost, { y: 120, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 0.0);
      tl.fromTo(shell, { y: 132, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 0.04);
      tl.fromTo(header, { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.42, ease: "power2.out" }, 0.18);
      tl.fromTo(hello, { y: 26, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, 0.32);
      tl.fromTo(sub, { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.46, ease: "power2.out" }, 0.5);
      tl.fromTo(composer, { y: 44, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 0.68);
      tl.fromTo(note, { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.38, ease: "power2.out" }, 0.92);

      // hidden until their own beats
      tl.set(bubble, { opacity: 0 }, 0);
      tl.set(status, { opacity: 0 }, 0);
      tl.set(tagA, { opacity: 0 }, 0);
      tl.set(tagB, { opacity: 0 }, 0);
      tl.set(typed, { opacity: 1 }, 0);
      tl.fromTo(typedText, { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 100% 0 0)", duration: 0.01 }, 0);

      // ---- Scene 2 (2.0–4.6): the prompt types character by character
      tl.fromTo(placeholder, { opacity: 1 }, { opacity: 0, duration: 0.18, ease: "power1.out" }, 1.95);
      tl.fromTo(caret, { opacity: 0 }, { opacity: 1, duration: 0.01 }, 1.95);
      tl.fromTo(
        typedText,
        { clipPath: "inset(0 100% 0 0)" },
        { clipPath: "inset(0 0% 0 0)", duration: TYPE_DUR, ease: "steps(" + CHARS + ")" },
        TYPE_START
      );
      var typedSpan = q(".f03-typed-text");
      var CARET_TRAVEL = typedSpan ? typedSpan.getBoundingClientRect().width : 0;
      tl.fromTo(
        caret,
        { x: 0 },
        { x: CARET_TRAVEL, duration: TYPE_DUR, ease: "steps(" + CHARS + ")" },
        TYPE_START
      );
      // deterministic caret blink (explicit fromTo pairs — no repeat/yoyo)
      for (var b = 2.0; b + 0.56 < 4.4; b += 0.56) {
        tl.fromTo(caret, { opacity: 1 }, { opacity: 0.15, duration: 0.01 }, b + 0.3);
        tl.fromTo(caret, { opacity: 0.15 }, { opacity: 1, duration: 0.01 }, b + 0.56);
      }
      // the send control lights up as soon as there is text
      tl.fromTo(send, { backgroundColor: MUTED, scale: 1 }, { backgroundColor: CORAL, duration: 0.28, ease: "power2.out" }, 2.22);
      tl.fromTo(send, { scale: 1 }, { scale: 1.08, duration: 0.16, ease: "power2.out" }, 2.22);
      tl.fromTo(send, { scale: 1.08 }, { scale: 1, duration: 0.24, ease: "power2.inOut" }, 2.38);

      // ---- Scene 3 (4.6–6.0): the message leaves as a user bubble, the composer empties
      tl.fromTo(send, { scale: 1 }, { scale: 0.9, duration: 0.12, ease: "power2.in" }, 4.5);
      tl.fromTo(send, { scale: 0.9 }, { scale: 1, duration: 0.3, ease: "power2.out" }, 4.62);
      tl.fromTo(caret, { opacity: 1 }, { opacity: 0, duration: 0.01 }, 4.5);
      tl.fromTo(typed, { opacity: 1 }, { opacity: 0, duration: 0.16, ease: "power1.out" }, 4.54);
      tl.fromTo(send, { backgroundColor: CORAL }, { backgroundColor: MUTED, duration: 0.3, ease: "power1.out" }, 4.7);
      tl.fromTo(placeholder, { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, 4.82);
      tl.fromTo(greet, { scale: 1, opacity: 1 }, { scale: 0.94, opacity: 0.38, duration: 0.7, ease: "power2.inOut" }, 4.6);
      tl.fromTo(
        bubble,
        { y: 86, opacity: 0, scale: 0.97 },
        { y: 0, opacity: 1, scale: 1, duration: 0.72, ease: "power3.out" },
        4.62
      );

      // ---- Scene 4 (6.0–8.2): working state + the mono turn label
      tl.fromTo(status, { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, 6.05);
      tl.fromTo(tagA, { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.42, ease: "power2.out" }, 6.6);
      // the status dot performs — finite, explicitly authored pulses
      for (var p = 6.2; p + 0.9 <= 9.95; p += 0.9) {
        tl.fromTo(dot, { scale: 1, opacity: 1 }, { scale: 1.45, opacity: 0.55, duration: 0.45, ease: "sine.inOut" }, p);
        tl.fromTo(dot, { scale: 1.45, opacity: 0.55 }, { scale: 1, opacity: 1, duration: 0.45, ease: "sine.inOut" }, p + 0.45);
      }

      // ---- Scene 5 (8.2–10.0): the label swaps to the model, the frame holds alive
      tl.fromTo(tagA, { opacity: 1, scale: 1 }, { opacity: 0, scale: 0.96, duration: 0.26, ease: "power2.in" }, 8.25);
      tl.fromTo(tagB, { opacity: 0, scale: 1.03 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" }, 8.45);

      window.__timelines = window.__timelines || {};
      window.__timelines["03-intencion"] = tl;
    })();
