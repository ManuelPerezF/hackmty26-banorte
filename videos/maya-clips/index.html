<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=400, height=400" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 400px; height: 400px; overflow: hidden; background: transparent; }
      #maya { display: block; width: 400px; height: 400px; object-fit: contain; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6.10" data-width="400" data-height="400">
      <video id="maya" class="clip" data-start="0" data-duration="6.10" data-track-index="0" src="assets/lista.mov" muted></video>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
