name: banorte-demo

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-banorte}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-banorte_local_demo}
      POSTGRES_DB: ${POSTGRES_DB:-banorte}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
